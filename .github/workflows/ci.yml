name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore backend
        run: dotnet restore backend/ShoppingHelper.Api/ShoppingHelper.Api.csproj
      - name: Build backend
        run: dotnet build backend/ShoppingHelper.Api/ShoppingHelper.Api.csproj -c Release --no-restore
      - name: Build backend Docker image
        run: docker build -t shoppinghelper-api-ci backend/ShoppingHelper.Api

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Build Android debug APK
        run: gradle -p android :app:assembleDebug --stacktrace
